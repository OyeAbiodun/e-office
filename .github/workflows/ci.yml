name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: Test
        run: pytest
      - name: Verify API starts
        env:
          MEETINGHQ_JWT_SECRET: ci-secret-value-with-at-least-32-characters
        run: |
          uvicorn meetinghq_api.main:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          trap "kill $api_pid" EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 1
          done
          exit 1

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint and format
        run: |
          npm run lint
          npm run format:check
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  containers:
    name: Container configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build containers
        run: docker compose build api web

