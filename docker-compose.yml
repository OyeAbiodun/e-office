name: meetinghq

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetinghq}
      POSTGRES_USER: ${POSTGRES_USER:-meetinghq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetinghq_dev_only}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${MEETINGHQ_POSTGRES_PUBLISHED_PORT:-5432}:5432"
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${MEETINGHQ_REDIS_PUBLISHED_PORT:-6379}:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      MEETINGHQ_DATABASE_URL: ${MEETINGHQ_DATABASE_URL:-postgresql+asyncpg://meetinghq:meetinghq_dev_only@postgres:5432/meetinghq}
      MEETINGHQ_REDIS_URL: ${MEETINGHQ_REDIS_URL:-redis://redis:6379/0}
      MEETINGHQ_JWT_SECRET: ${MEETINGHQ_JWT_SECRET:-local-development-secret-change-me}
      MEETINGHQ_WEB_APP_URL: ${MEETINGHQ_WEB_APP_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${MEETINGHQ_API_PUBLISHED_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MEETINGHQ_WEB_PUBLISHED_PORT:-5173}:80"
    restart: unless-stopped

  gateway:
    image: nginx:1.29-alpine
    profiles: ["gateway"]
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "${MEETINGHQ_GATEWAY_PUBLISHED_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
