[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "meetinghq-api"
version = "0.1.0"
description = "MeetingHQ HTTP API"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "asyncpg>=0.30,<1",
  "cryptography>=50,<51",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "nh3>=0.3,<1",
  "pydantic-settings>=2.10,<3",
  "psutil>=6,<8",
  "pywebpush>=2.1,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "qrcode>=8.2,<9",
  "redis>=6.2,<7",
  "reportlab>=4.4,<5",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<26",
  "tzdata>=2026.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "black>=26.3.1,<27",
  "mypy>=1.17,<2",
  "pre-commit>=4.2,<5",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "aiosqlite>=0.21,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meetinghq_api"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=meetinghq_api --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "T20"]
ignore = ["S101", "S105"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/4a920ac8fc35_add_leave_ledger_idempotency.py" = ["I001"]
"alembic/versions/60232000eebe_add_leave_management_foundation.py" = ["I001"]
"alembic/versions/c8d1e9a4b702_add_finance_transfer_groups.py" = ["I001"]
"alembic/versions/d9e2f0a5c103_add_voucher_task_link.py" = ["I001"]
"alembic/versions/de70f82cef35_add_leave_supporting_attachments.py" = ["I001"]
"alembic/versions/f3cb669e64ff_add_voucher_finance_foundation.py" = ["E501", "I001"]

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = '''
(
  /alembic/versions/(0013_workspace_product|0014_team_product|0031_chat_push_notification_hardening|0032_backfill_direct_member_keys|4a920ac8fc35_add_leave_ledger_idempotency|60232000eebe_add_leave_management_foundation|b73c8f51a902_finance_integrity_guards|c8d1e9a4b702_add_finance_transfer_groups|d9e2f0a5c103_add_voucher_task_link|de70f82cef35_add_leave_supporting_attachments|f3cb669e64ff_add_voucher_finance_foundation)\.py$
  | /\.test-temp-[^/]+/
)
'''

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["meetinghq_api"]
